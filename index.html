<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundown 17 Agustus — Panel Operator</title>
<style>
  :root{
    --bg:#0B0F14;
    --bg-elev:#12181F;
    --bg-elev-2:#1A222B;
    --text:#F3EFE4;
    --text-dim:#8B93A0;
    --red:#C1272D;
    --red-dim:#5C1418;
    --gold:#D4A017;
    --gold-glow:rgba(212,160,23,.35);
    --green-done:#5C7A52;
    --border:#242C36;
    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
  }

  body.light{
    --bg:#F5F1E8;
    --bg-elev:#FFFFFF;
    --bg-elev-2:#EDE8DC;
    --text:#1D242E;
    --text-dim:#6A7280;
    --border:#D0CAB8;
    --gold-glow:rgba(212,160,23,.25);
    --green-done:#3A6B31;
  }
  body.light .status-pill[data-state="ontime"]{ color:#2E6B22; border-color:#A3C49A; }
  body.light .status-pill[data-state="ahead"]{ color:#1E5280; border-color:#8AAEC9; }
  body.light .status-pill[data-state="behind"]{ color:#8B2E22; border-color:#D0857A; }
  body.light .segment.active .title{ color:#0D0A00; }
  body.light .rail-flag{ box-shadow:0 1px 4px rgba(0,0,0,.2); }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    overflow:hidden;
  }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .app{
    display:grid;
    grid-template-rows:auto auto 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    padding:12px 28px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--bg-elev), var(--bg));
  }
  .topbar .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .topbar .brand .flag-mark{
    display:inline-block;
    width:20px;
    height:14px;
    border-radius:1px;
    background:linear-gradient(to bottom, var(--red) 50%, #FFFFFF 50%);
    box-shadow:0 0 0 1px var(--border);
  }
  .topbar h1{
    font-family:var(--font-display);
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:.02em;
    margin:0;
    color:var(--text);
  }
  .topbar .sub{
    font-size:.72rem;
    color:var(--text-dim);
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .clock{
    font-family:var(--font-mono);
    font-size:clamp(1.3rem, 4vw, 2rem);
    font-weight:600;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .status-pill{
    font-family:var(--font-ui);
    font-size:.78rem;
    font-weight:600;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-elev-2);
    color:var(--text-dim);
  }
  .status-pill[data-state="ontime"]{ color:#9CC48A; border-color:#3A4A34; }
  .status-pill[data-state="ahead"]{ color:#8FB6D9; border-color:#2E4152; }
  .status-pill[data-state="behind"]{ color:#E0917E; border-color:#5C2B24; }

  .reset-btn{
    font-family:var(--font-ui);
    font-size:.72rem;
    color:var(--text-dim);
    background:none;
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    touch-action:manipulation;
    min-height:32px;
  }
  .reset-btn:hover{ color:var(--text); border-color:var(--text-dim); }

  .ost-btn.on{
    color:var(--gold);
    border-color:var(--gold);
    background:var(--gold-glow);
  }

  /* ---------- soundboard strip ---------- */
  .sfxbar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 20px;
    border-bottom:1px solid var(--border);
    background:var(--bg-elev);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .sfxbar::-webkit-scrollbar{ display:none; }
  .sfxbar-label{
    font-size:.65rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--text-dim);
    white-space:nowrap;
    margin-right:4px;
    flex-shrink:0;
  }
  .sfx-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--font-ui);
    font-size:.75rem;
    font-weight:600;
    color:var(--text-dim);
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 10px;
    cursor:pointer;
    white-space:nowrap;
    min-height:32px;
    touch-action:manipulation;
    flex-shrink:0;
    transition:border-color .12s, color .12s;
  }
  .sfx-btn:hover{ color:var(--text); border-color:var(--text-dim); }
  .sfx-btn.playing{
    color:var(--gold);
    border-color:var(--gold);
    background:var(--gold-glow);
  }
  .sfx-key{
    font-family:var(--font-mono);
    font-size:.65rem;
    color:var(--gold);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:3px;
    padding:1px 4px;
    line-height:1.2;
  }
  .sfx-btn.playing .sfx-key{ background:var(--gold-glow); }

  /* ---------- volume toast ---------- */
  #volToast{
    position:fixed;
    top:56px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--font-mono);
    font-size:.82rem;
    font-weight:600;
    color:var(--gold);
    background:var(--bg-elev);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:5px 16px;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s;
    z-index:999;
  }

  /* ---------- layout ---------- */
  .main{
    display:grid;
    grid-template-columns:340px 1fr;
    min-height:0;
    overflow:hidden;
  }

  /* ---------- sidebar / flagpole rail ---------- */
  .sidebar{
    display:grid;
    grid-template-columns:34px 1fr;
    border-right:1px solid var(--border);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px 0 20px 14px;
    background:var(--bg-elev);
  }

  .rail{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .rail-pole{
    position:absolute;
    top:6px;
    bottom:6px;
    width:2px;
    background:var(--border);
  }
  .rail-fill{
    position:absolute;
    bottom:6px;
    width:2px;
    background:linear-gradient(to top, var(--red), var(--gold));
    transition:height .6s ease;
  }
  @media (prefers-reduced-motion:reduce){ .rail-fill{ transition:none; } }
  .rail-flag{
    position:absolute;
    width:18px;
    height:13px;
    left:50%;
    transform:translateX(calc(-50% + 1px));
    background:linear-gradient(to bottom, var(--red) 50%, #FFFFFF 50%);
    box-shadow:0 1px 4px rgba(0,0,0,.6);
    transition:bottom .6s ease;
  }
  @media (prefers-reduced-motion:reduce){ .rail-flag{ transition:none; } }

  .segments{
    list-style:none;
    margin:0;
    padding:0 12px 0 0;
    display:flex;
    flex-direction:column;
  }
  .segment{
    display:grid;
    grid-template-columns:1.6rem 1fr;
    gap:8px;
    padding:11px 10px;
    margin-bottom:2px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    background:none;
    text-align:left;
    color:var(--text);
    font-family:inherit;
    width:100%;
    min-height:44px;
    touch-action:manipulation;
  }
  .segment:hover{ background:var(--bg-elev-2); }
  .segment .num{
    font-family:var(--font-mono);
    font-size:.72rem;
    color:var(--text-dim);
    padding-top:2px;
  }
  .segment .title{
    font-size:.86rem;
    font-weight:600;
    line-height:1.3;
  }
  .segment .time{
    font-family:var(--font-mono);
    font-size:.7rem;
    color:var(--text-dim);
    margin-top:2px;
  }
  .segment .pic{
    font-size:.7rem;
    color:var(--text-dim);
    margin-top:2px;
    font-style:italic;
  }

  .segment.done{ opacity:.45; }
  .segment.done .num::before{ content:"✓ "; color:var(--green-done); }
  .segment.active{
    background:var(--bg-elev-2);
    border-color:var(--gold-glow);
    box-shadow:0 0 0 1px var(--gold-glow), 0 0 22px -8px var(--gold-glow);
  }
  .segment.active .num{ color:var(--gold); }
  .segment.active .title{ color:#FFF6DE; }

  /* ---------- stage ---------- */
  .stage{
    display:flex;
    flex-direction:column;
    padding:36px 44px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    min-height:0;
  }
  .stage .eyebrow{
    font-size:.76rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:10px;
  }
  .stage h2{
    font-family:var(--font-display);
    font-size:clamp(1.6rem, 4vw, 3.2rem);
    line-height:1.12;
    margin:0 0 14px;
    font-weight:700;
  }
  .stage .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    margin-bottom:28px;
    padding-bottom:26px;
    border-bottom:1px solid var(--border);
  }
  .meta-item .label{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .meta-item .value{
    font-size:1.05rem;
    font-weight:600;
    font-family:var(--font-mono);
  }
  .meta-item .value.pic-value{ font-family:var(--font-ui); font-weight:500; }

  .seg-note{
    margin-top:14px; padding:10px 14px;
    border:1px solid var(--gold); border-radius:8px;
    background:var(--gold-glow);
    color:var(--text); font-size:0.95rem;
  }

  .timer-block{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:30px;
  }
  .timer-block .big-timer{
    font-family:var(--font-mono);
    font-size:clamp(2rem, 6vw, 4.4rem);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--gold);
  }
  .timer-block .timer-label{
    font-size:.82rem;
    color:var(--text-dim);
  }

  .video-block{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    margin-bottom:28px;
  }
  .video-block .video-title{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .video-block .video-name{
    font-size:.92rem;
    margin-bottom:16px;
    color:var(--text);
  }
  .video-block .video-actions{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .play-btn{
    font-family:var(--font-ui);
    font-size:.9rem;
    font-weight:700;
    color:#161006;
    background:linear-gradient(180deg, #E7BB3A, var(--gold));
    border:none;
    border-radius:8px;
    padding:11px 20px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    touch-action:manipulation;
    min-height:44px;
  }
  .play-btn:hover{ filter:brightness(1.08); }
  .play-btn::before{ content:"▶"; font-size:.75rem; }

  .pick-link{
    font-size:.78rem;
    color:var(--text-dim);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    touch-action:manipulation;
  }
  .pick-link:hover{ color:var(--text); }

  .controls{
    margin-top:auto;
    display:flex;
    gap:12px;
    padding-top:24px;
  }
  .nav-btn{
    font-family:var(--font-ui);
    font-size:.88rem;
    font-weight:600;
    padding:12px 22px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg-elev);
    color:var(--text);
    cursor:pointer;
    touch-action:manipulation;
    min-height:44px;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--text-dim); }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .nav-btn.primary{
    background:var(--red);
    border-color:var(--red);
    color:#FFF3EF;
  }
  .nav-btn.primary:hover:not(:disabled){ background:#D6353B; }
  .hint{
    align-self:center;
    font-size:.7rem;
    color:var(--text-dim);
    margin-left:6px;
  }

  /* ---------- track / audio / playlist blocks ---------- */
  .audio-block{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    margin-bottom:28px;
  }
  .audio-block .audio-title{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .track-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .track-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid transparent;
    background:var(--bg-elev-2);
    transition:border-color .15s;
  }
  .track-row.playing{
    border-color:var(--gold-glow);
    box-shadow:0 0 0 1px var(--gold-glow);
  }
  .track-num{
    font-family:var(--font-mono);
    font-size:.72rem;
    color:var(--text-dim);
    min-width:1.4rem;
  }
  .track-row.playing .track-num{ color:var(--gold); }
  .track-label{
    flex:1;
    font-size:.9rem;
    font-weight:600;
  }
  .track-btn{
    font-family:var(--font-ui);
    font-size:.8rem;
    font-weight:700;
    color:#161006;
    background:linear-gradient(180deg, #E7BB3A, var(--gold));
    border:none;
    border-radius:6px;
    padding:7px 14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    touch-action:manipulation;
    min-height:44px;
  }
  .track-btn:hover{ filter:brightness(1.08); }
  .track-btn::before{ content:"▶"; font-size:.65rem; }
  .track-btn.pause-btn::before{ content:"⏸"; }

  /* ---------- winner lists (Pengumuman Hadiah) ---------- */
  .winner-block{ padding:18px 22px; margin-bottom:16px; }
  .winner-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }
  .winner-tier{ font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); font-weight:700; margin-bottom:6px; }
  .winner-name{ font-size:.92rem; padding:3px 0; }

  /* ---------- inline video preview ---------- */
  .inline-preview{
    width:100%;
    max-width:720px;
    border-radius:8px;
    display:block;
    background:#000;
    margin-top:12px;
  }

  #filePicker{ display:none; }

  /* ---------- responsive: tablet / small desktop ---------- */
  @media (max-width:820px){
    .main{ grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow:hidden; }
    .sidebar{
      border-right:none;
      border-bottom:1px solid var(--border);
      max-height:34dvh;
      max-height:34vh;
    }
    .stage{ padding:20px 20px 0; }
    .controls{
      position:sticky;
      bottom:0;
      background:var(--bg);
      border-top:1px solid var(--border);
      padding:12px 0 max(16px, env(safe-area-inset-bottom));
      margin-top:auto;
      gap:8px;
    }
    .nav-btn{ flex:1; }
    .hint{ display:none; }
    .topbar{ padding:10px 16px; }
  }

  /* ---------- responsive: small phones ---------- */
  @media (max-width:480px){
    .sidebar{ grid-template-columns:1fr; }
    .rail{ display:none; }
    .segments{ padding-right:8px; }
    .stage .meta-row{ gap:14px; }
    .inline-preview{ max-width:100%; }
    .track-row{ padding:8px 10px; }
    .status-pill{ display:none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="flag-mark" aria-hidden="true"></span>
      <div>
        <h1>Rundown 17 Agustus</h1>
        <div class="sub">Panel Operator</div>
      </div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="topbar-right">
      <div class="status-pill" id="statusPill">—</div>
      <button class="reset-btn ost-btn" id="ostBtn" title="Musik latar (OST)">♫ OST</button>
      <button class="reset-btn" id="themeBtn" title="Ganti tema gelap/terang">☾</button>
      <button class="reset-btn" id="resetBtn" title="Reset seluruh progres">Reset</button>
    </div>
  </header>

  <div class="sfxbar" id="sfxbar"><!-- populated by JS --></div>

  <div class="main">
    <nav class="sidebar" aria-label="Daftar susunan acara">
      <div class="rail" id="rail">
        <div class="rail-pole"></div>
        <div class="rail-fill" id="railFill"></div>
        <div class="rail-flag" id="railFlag" title="Progres acara"></div>
      </div>
      <ol class="segments" id="segments"></ol>
    </nav>

    <main class="stage" id="stage">
      <!-- populated by JS -->
    </main>
  </div>
</div>

<input type="file" id="filePicker" accept="video/*,audio/*">
<video id="stageVideo" style="display:none;"></video>
<audio id="stageAudio"></audio>
<audio id="bgAudio" loop></audio>
<audio id="sfxAudio"></audio>
<div id="volToast"></div>

    { start:"20.45", end:null, title:"Pensi", pic:"Tante Galuh", audio:[
      { src:"assets/MUTIARA.mp3", label:"Mutiara" },
      { src:"assets/JALARANING TRESNA.mp3", label:"Jalaraning Tresna" }
    ], videoTitle:"Video Karaoke", videos:[
      { src:"assets/karaoke-edan-turun.mp4", label:"Edan Turun (Demy)" },
      { src:"assets/karaoke-jangan-tunggu-lama-lama.mp4", label:"Jangan Tunggu Lama Lama (Cici Faramida)" },
      { src:"assets/jula-juli-kidungan.mp4", label:"Jula-Juli Kidungan Jawa Timur" }
    ]},
    { start:null, end:null, title:"Penutup", pic:"Semua Warga", ost:"assets/ost-kemesraan.mp3" }
  ];

  var STORAGE_KEY = "rundown17an-state-v1";
  var THEME_KEY   = "rundown17an-theme";

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { activeIndex:0, actualStarts:{} };
  }
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  var state = loadState();
  if(typeof state.activeIndex !== "number") state.activeIndex = 0;
  if(!state.actualStarts) state.actualStarts = {};

  // ---------- theme ----------
  var themeBtn = document.getElementById("themeBtn");
  if(localStorage.getItem(THEME_KEY) === "light"){
    document.body.classList.add("light");
    themeBtn.textContent = "☀";
  }
  themeBtn.addEventListener("click", function(){
    var isLight = document.body.classList.toggle("light");
    themeBtn.textContent = isLight ? "☀" : "☾";
    localStorage.setItem(THEME_KEY, isLight ? "light" : "dark");
  });

  // ---------- OST / background music ----------
  var OST_WAIT  = "assets/ost-medley.mp3";       // waiting — vocal medley
  var OST_TRANS = "assets/ost-instrumental.mp3"; // transitions — instrumental only

  function ostSrc(){
    var seg = RUNDOWN[state.activeIndex];
    if(seg && seg.ost) return seg.ost;
    return state.activeIndex === 0 ? OST_WAIT : OST_TRANS;
  }

  var bgAudio = document.getElementById("bgAudio");
  var ostBtn  = document.getElementById("ostBtn");
  var ostEnabled = false;
  var ostVolume  = 1;
  var _fadeTimer = null;
  var _toastTimer = null;

  function showVolumeToast(text){
    var el = document.getElementById("volToast");
    el.textContent = "♫ " + text;
    el.style.opacity = "1";
    if(_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){ el.style.opacity = "0"; }, 1200);
  }

  function setOstVolume(delta){
    ostVolume = Math.max(0, Math.min(1, Math.round((ostVolume + delta) * 10) / 10));
    if(!bgAudio.paused) bgAudio.volume = ostVolume;
    showVolumeToast(Math.round(ostVolume * 100) + "%");
  }

  function fmtPos(s){ return Math.floor(s/60) + ":" + (Math.floor(s%60)<10?"0":"") + Math.floor(s%60); }
  function seekOst(delta){
    if(bgAudio.paused) return;
    var d = bgAudio.duration || 0;
    bgAudio.currentTime = Math.max(0, Math.min(d ? d - 0.5 : bgAudio.currentTime + delta, bgAudio.currentTime + delta));
    showVolumeToast(fmtPos(bgAudio.currentTime) + (d ? " / " + fmtPos(d) : ""));
  }

  function fadeTo(audio, target, ms){
    if(_fadeTimer) clearInterval(_fadeTimer);
    var step = (target - audio.volume) / (ms / 40);
    _fadeTimer = setInterval(function(){
      var next = audio.volume + step;
      if((step > 0 && next >= target) || (step < 0 && next <= target)){
        audio.volume = Math.max(0, Math.min(1, target));
        if(target === 0){ audio.pause(); }
        clearInterval(_fadeTimer);
        _fadeTimer = null;
      } else {
        audio.volume = Math.max(0, Math.min(1, next));
      }
    }, 40);
  }

  function duckOst(){
    if(!ostEnabled || bgAudio.paused) return;
    fadeTo(bgAudio, 0, 600);
  }

  function resumeOstIfEnabled(){
    if(!ostEnabled) return;
    var seg = RUNDOWN[state.activeIndex];
    if(seg && seg.noOst){ if(!bgAudio.paused) fadeTo(bgAudio, 0, 600); return; }
    var fgActive = !stageAudio.paused;
    if(!fgActive){
      var vids = document.querySelectorAll("video");
      for(var vi = 0; vi < vids.length; vi++){
        if(!vids[vi].paused){ fgActive = true; break; }
      }
    }
    if(!fgActive){
      var src = ostSrc();
      if(bgAudio.getAttribute("src") !== src){ bgAudio.src = src; }
      bgAudio.volume = 0;
      bgAudio.play().catch(function(){});
      fadeTo(bgAudio, ostVolume, 800);
    }
  }

  ostBtn.addEventListener("click", function(){
    ostEnabled = !ostEnabled;
    if(ostEnabled){
      resumeOstIfEnabled();
    } else {
      fadeTo(bgAudio, 0, 600);
    }
    ostBtn.classList.toggle("on", ostEnabled);
  });

  function timeStrToDate(str){
    if(!str) return null;
    var parts = str.split(".");
    var d = new Date();
    d.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
    return d;
  }

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function fmtHMS(ms){
    var neg = ms < 0;
    ms = Math.abs(ms);
    var s = Math.floor(ms/1000);
    var h = Math.floor(s/3600);
    var m = Math.floor((s%3600)/60);
    var sec = s%60;
    var out = (h>0 ? h+":" : "") + pad(m) + ":" + pad(sec);
    return (neg ? "-" : "") + out;
  }

  // ---------- render sidebar ----------
  var segmentsEl = document.getElementById("segments");
  var railFill = document.getElementById("railFill");
  var railFlag = document.getElementById("railFlag");

  function renderSidebar(){
    segmentsEl.innerHTML = "";
    RUNDOWN.forEach(function(seg, i){
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.className = "segment";
      if(i < state.activeIndex) btn.className += " done";
      if(i === state.activeIndex) btn.className += " active";
      btn.setAttribute("data-index", i);

      var timeLabel = seg.start ? (seg.start + (seg.end ? "–"+seg.end : "")) : "—";

      btn.innerHTML =
        '<span class="num">'+pad(i+1)+'</span>' +
        '<span>' +
          '<div class="title">'+seg.title+'</div>' +
          '<div class="time">'+timeLabel+'</div>' +
          (seg.pic ? '<div class="pic">'+seg.pic+'</div>' : '') +
        '</span>';

      btn.addEventListener("click", function(){
        goTo(i);
      });
      li.appendChild(btn);
      segmentsEl.appendChild(li);
    });

    var pct = RUNDOWN.length > 1 ? (state.activeIndex / (RUNDOWN.length-1)) : 0;
    pct = Math.max(0, Math.min(1, pct));
    var railEl = document.getElementById("rail");
    var railH = railEl.offsetHeight - 12;
    railFill.style.height = (pct*railH) + "px";
    railFlag.style.bottom = (6 + pct*railH - 6) + "px";

    // scroll active segment into view
    var activeBtn = segmentsEl.querySelector(".segment.active");
    if(activeBtn) activeBtn.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }

  // ---------- render stage ----------
  var stageEl = document.getElementById("stage");
  var stageVideo = document.getElementById("stageVideo");
  var stageAudio = document.getElementById("stageAudio");
  var filePicker = document.getElementById("filePicker");

  stageAudio.addEventListener("play", duckOst);

  // ---------- soundboard ----------
  var SFX = [
    { key:"1", label:"Tepuk Tangan", src:"assets/sfx/applause.mp3" },
    { key:"2", label:"Sorak",        src:"assets/sfx/cheer.mp3" },
    { key:"3", label:"Drum Roll",    src:"assets/sfx/drumroll.mp3" },
    { key:"4", label:"Tada!",        src:"assets/sfx/tada.mp3" },
    { key:"5", label:"Airhorn",      src:"assets/sfx/airhorn.mp3" },
    { key:"6", label:"Tawa",         src:"assets/sfx/laugh.mp3" },
    { key:"7", label:"Jangkrik",     src:"assets/sfx/crickets.mp3" },
    { key:"8", label:"Sad Trombon",  src:"assets/sfx/sad-trombone.mp3" },
    { key:"9", label:"Ding",         src:"assets/sfx/ding.mp3" },
    { key:"0", label:"Buzzer",       src:"assets/sfx/buzzer.mp3" }
  ];

  var sfxAudio = document.getElementById("sfxAudio");
  var sfxBarEl = document.getElementById("sfxbar");
  var activeSfxIdx = null;

  function updateSfxUI(){
    SFX.forEach(function(_, idx){
      var btn = document.getElementById("sfx-btn-"+idx);
      if(btn) btn.classList.toggle("playing", idx === activeSfxIdx && !sfxAudio.paused);
    });
  }

  function playSfx(idx){
    if(activeSfxIdx === idx && !sfxAudio.paused){
      sfxAudio.pause();
      sfxAudio.currentTime = 0;
      activeSfxIdx = null;
    } else {
      activeSfxIdx = idx;
      sfxAudio.src = SFX[idx].src;
      sfxAudio.currentTime = 0;
      sfxAudio.play().catch(function(){});
    }
    updateSfxUI();
  }

  sfxAudio.addEventListener("ended", function(){ activeSfxIdx = null; updateSfxUI(); });
  sfxAudio.addEventListener("pause", updateSfxUI);

  function renderSfxBar(){
    var html = '<span class="sfxbar-label">Efek</span>';
    SFX.forEach(function(sfx, idx){
      html += '<button class="sfx-btn" id="sfx-btn-'+idx+'" title="Tombol '+sfx.key+'">';
      html += '<span class="sfx-key">'+sfx.key+'</span> '+sfx.label;
      html += '</button>';
    });
    sfxBarEl.innerHTML = html;
    SFX.forEach(function(_, idx){
      document.getElementById("sfx-btn-"+idx).addEventListener("click", function(){ playSfx(idx); });
    });
  }
  var overrideVideoUrl = null;
  var overrideForIndex = null;
  var playingTrackIndex = null;

  function renderStage(){
    var i = state.activeIndex;
    var seg = RUNDOWN[i];
    var isLast = i === RUNDOWN.length - 1;

    var timeLabel = seg.start ? (seg.start + (seg.end ? " – "+seg.end : "")) : "—";

    var html = "";
    html += '<div class="eyebrow">Segmen '+pad(i+1)+' dari '+RUNDOWN.length+'</div>';
    html += '<h2>'+seg.title+'</h2>';
    html += '<div class="meta-row">';
    html += '<div class="meta-item"><div class="label">Jadwal</div><div class="value">'+timeLabel+'</div></div>';
    if(seg.pic){
      html += '<div class="meta-item"><div class="label">Penanggung Jawab</div><div class="value pic-value">'+seg.pic+'</div></div>';
    }
    html += '</div>';

    if(seg.note){
      html += '<div class="seg-note">'+seg.note+'</div>';
    }

    html += '<div class="timer-block">';
    html += '<div class="big-timer" id="bigTimer">00:00</div>';
    html += '<div class="timer-label">berjalan sejak segmen ini dimulai</div>';
    html += '</div>';

    // multi-video playlist (e.g. lagu upacara)
    if(seg.videos){
      html += '<div class="audio-block">';
      html += '<div class="audio-title">'+(seg.videoTitle||"Lagu")+'</div>';
      html += '<div class="track-list">';
      seg.videos.forEach(function(track, ti){
        html += '<div class="track-row" id="vt-row-'+ti+'">';
        html += '<span class="track-num" id="vt-num-'+ti+'">'+pad(ti+1)+'</span>';
        html += '<span class="track-label">'+track.label+'</span>';
        html += '<button class="track-btn" id="vt-btn-'+ti+'">Putar</button>';
        html += '</div>';
      });
      html += '</div>';
      html += '<video id="songPlayer" class="inline-preview" controls preload="metadata" style="display:none;"></video>';
      html += '</div>';
    }

    // single embedded video
    if(seg.video){
      html += '<div class="video-block">';
      html += '<div class="video-title">Video</div>';
      html += '<div class="video-name">'+(seg.videoLabel||seg.video)+(seg.videoNote ? ' <span style="color:var(--text-dim);">'+seg.videoNote+'</span>' : '')+'</div>';
      if(seg.embed){
        var src = (overrideForIndex === i && overrideVideoUrl) ? overrideVideoUrl : seg.video;
        if(seg.videoStart) src += '#t=' + seg.videoStart;
        html += '<video id="embedVideo" class="inline-preview" controls preload="metadata"'+(seg.videoLoop ? ' loop' : '')+' src="'+src+'"></video>';
      } else {
        html += '<div class="video-actions">';
        html += '<button class="play-btn" id="playBtn">Putar Layar Penuh</button>';
        html += '<button class="pick-link" id="pickBtn">Pilih video lain…</button>';
        html += '</div>';
      }
      html += '</div>';
    }

    // audio playlist (pensi)
    if(seg.audio){
      html += '<div class="audio-block">';
      html += '<div class="audio-title">Musik Pensi</div>';
      html += '<div class="track-list">';
      seg.audio.forEach(function(track, ti){
        var isPlaying = (playingTrackIndex === ti) && (i === state.activeIndex);
        html += '<div class="track-row'+(isPlaying?' playing':'')+ '" id="track-row-'+ti+'">';
        html += '<span class="track-num">'+(isPlaying ? '♪' : pad(ti+1))+'</span>';
        html += '<span class="track-label">'+track.label+'</span>';
        html += '<button class="track-btn'+(isPlaying?' pause-btn':'')+ '" id="track-btn-'+ti+'">'+
                  (isPlaying ? 'Jeda' : 'Putar')+'</button>';
        html += '</div>';
      });
      html += '</div></div>';
    }

    // winner lists (Pengumuman Hadiah)
    if(seg.winners){
      seg.winners.forEach(function(cat){
        html += '<div class="audio-block winner-block">';
        html += '<div class="audio-title">'+cat.title+'</div>';
        html += '<div class="winner-grid">';
        cat.groups.forEach(function(g){
          html += '<div class="winner-group">';
          html += '<div class="winner-tier">'+g.tier+'</div>';
          g.names.forEach(function(n){ html += '<div class="winner-name">'+n+'</div>'; });
          html += '</div>';
        });
        html += '</div></div>';
      });
    }

    html += '<div class="controls">';
    html += '<button class="nav-btn" id="prevBtn" '+(i===0?'disabled':'')+'>← Sebelumnya</button>';
    html += '<button class="nav-btn primary" id="nextBtn" '+(isLast?'disabled':'')+'>Berikutnya →</button>';
    html += '<span class="hint">Spasi / Panah = navigasi · '+(seg.video && seg.embed ? 'Enter = video' : 'Enter = OST')+' · −/+ = vol · &lt;/&gt; = seek · 1–0 = efek suara</span>';
    html += '</div>';

    stageEl.innerHTML = html;

    // duck OST whenever any inline video starts playing
    stageEl.querySelectorAll("video").forEach(function(v){ v.addEventListener("play", duckOst); });

    // apply per-segment default volume to embedded video
    var embedVideo = document.getElementById("embedVideo");
    if(embedVideo && seg.videoVolume != null) embedVideo.volume = seg.videoVolume;

    document.getElementById("prevBtn").addEventListener("click", function(){ goTo(state.activeIndex-1); });
    document.getElementById("nextBtn").addEventListener("click", function(){ goTo(state.activeIndex+1); });

    if(seg.video && !seg.embed){
      document.getElementById("playBtn").addEventListener("click", function(){ playVideo(seg, i); });
      document.getElementById("pickBtn").addEventListener("click", function(){ filePicker.click(); });
    }

    if(seg.audio){
      seg.audio.forEach(function(track, ti){
        document.getElementById("track-btn-"+ti).addEventListener("click", function(){ playAudio(track, ti, i); });
      });
    }

    if(seg.videos){
      var songPlayer = document.getElementById("songPlayer");
      var currentSongIdx = null;

      function updateSongUI(){
        seg.videos.forEach(function(_, ti){
          var row = document.getElementById("vt-row-"+ti);
          var num = document.getElementById("vt-num-"+ti);
          var btn = document.getElementById("vt-btn-"+ti);
          if(!row) return;
          var isActive = currentSongIdx === ti;
          var isPlaying = isActive && !songPlayer.paused;
          row.classList.toggle("playing", isActive);
          num.textContent = isActive ? "♪" : pad(ti+1);
          btn.classList.toggle("pause-btn", isPlaying);
          btn.textContent = isPlaying ? "Jeda" : (isActive ? "Lanjut" : "Putar");
        });
      }

      seg.videos.forEach(function(track, ti){
        document.getElementById("vt-btn-"+ti).addEventListener("click", function(){
          if(currentSongIdx === ti){
            if(songPlayer.paused){ songPlayer.play().catch(function(){}); }
            else { songPlayer.pause(); }
          } else {
            currentSongIdx = ti;
            songPlayer.src = track.src + (track.end ? '#t=,' + track.end : '');
            songPlayer.style.display = "block";
            songPlayer.play().catch(function(){});
          }
          updateSongUI();
        });
      });

      songPlayer.addEventListener("pause", updateSongUI);
      songPlayer.addEventListener("play", updateSongUI);
    }
  }

  function playVideo(seg, i){
    duckOst();
    var src = (overrideForIndex === i && overrideVideoUrl) ? overrideVideoUrl : seg.video;
    if(stageVideo.getAttribute("data-src") !== src){
      stageVideo.src = src;
      stageVideo.setAttribute("data-src", src);
    }
    stageVideo.style.display = "block";
    if(stageVideo.requestFullscreen){
      stageVideo.requestFullscreen().catch(function(){});
    }
    stageVideo.play().catch(function(){});
  }

  function playAudio(track, ti, segIndex){
    var isAlreadyPlaying = (playingTrackIndex === ti) && !stageAudio.paused;
    stageAudio.pause();
    if(isAlreadyPlaying){
      playingTrackIndex = null;
      renderStage();
      return;
    }
    playingTrackIndex = ti;
    stageAudio.src = track.src;
    stageAudio.play().catch(function(){});
    renderStage();

    stageAudio.onended = function(){
      var seg = RUNDOWN[segIndex];
      var next = ti + 1;
      if(seg.audio && next < seg.audio.length){
        playAudio(seg.audio[next], next, segIndex);
      } else {
        playingTrackIndex = null;
        renderStage();
      }
    };
  }

  filePicker.addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(overrideVideoUrl) URL.revokeObjectURL(overrideVideoUrl);
    overrideVideoUrl = URL.createObjectURL(file);
    overrideForIndex = state.activeIndex;
    var seg = RUNDOWN[state.activeIndex];
    playVideo(seg, state.activeIndex);
  });

  document.addEventListener("fullscreenchange", function(){
    if(!document.fullscreenElement){
      stageVideo.pause();
      stageVideo.style.display = "none";
    }
  });

  // ---------- navigation ----------
  function goTo(i){
    if(i < 0 || i >= RUNDOWN.length) return;
    stageAudio.pause();
    playingTrackIndex = null;
    stageEl.querySelectorAll("video").forEach(function(v){ v.pause(); });
    state.activeIndex = i;
    if(!state.actualStarts[i]){
      state.actualStarts[i] = new Date().toISOString();
    }
    saveState();
    renderSidebar();
    renderStage();
    resumeOstIfEnabled();
  }

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("Reset seluruh progres rundown? Waktu mulai aktual akan dihapus.")){
      state = { activeIndex:0, actualStarts:{} };
      saveState();
      renderSidebar();
      renderStage();
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "INPUT") return;
    if(e.code === "Space" || e.code === "ArrowRight"){
      e.preventDefault();
      goTo(state.activeIndex+1);
    } else if(e.code === "ArrowLeft"){
      e.preventDefault();
      goTo(state.activeIndex-1);
    } else if(e.code === "Enter" || e.code === "NumpadEnter"){
      if(e.target.tagName === "BUTTON") return;
      e.preventDefault();
      var embedVideo = document.getElementById("embedVideo");
      if(embedVideo){
        if(embedVideo.paused) embedVideo.play().catch(function(){});
        else embedVideo.pause();
      } else {
        ostBtn.click();
      }
    } else if(e.code === "Minus" || e.code === "NumpadSubtract"){
      e.preventDefault();
      setOstVolume(-0.1);
    } else if(e.code === "Equal" || e.code === "NumpadAdd"){
      e.preventDefault();
      setOstVolume(0.1);
    } else if(e.code === "Comma"){
      e.preventDefault();
      seekOst(-10);
    } else if(e.code === "Period"){
      e.preventDefault();
      seekOst(10);
    } else {
      var sfxKeys = {"Digit1":0,"Digit2":1,"Digit3":2,"Digit4":3,"Digit5":4,
                     "Digit6":5,"Digit7":6,"Digit8":7,"Digit9":8,"Digit0":9,
                     "Numpad1":0,"Numpad2":1,"Numpad3":2,"Numpad4":3,"Numpad5":4,
                     "Numpad6":5,"Numpad7":6,"Numpad8":7,"Numpad9":8,"Numpad0":9};
      if(sfxKeys[e.code] !== undefined && e.target.tagName !== "INPUT"){
        e.preventDefault();
        playSfx(sfxKeys[e.code]);
      }
    }
  });

  // ---------- clock / timers / status ----------
  var clockEl = document.getElementById("clock");
  var statusPill = document.getElementById("statusPill");

  function tick(){
    var now = new Date();
    clockEl.textContent = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());

    var seg = RUNDOWN[state.activeIndex];
    var startedIso = state.actualStarts[state.activeIndex];
    var bigTimerEl = document.getElementById("bigTimer");
    if(bigTimerEl && startedIso){
      var elapsed = now - new Date(startedIso);
      bigTimerEl.textContent = fmtHMS(elapsed);
    }

    var scheduled = timeStrToDate(seg.start);
    if(scheduled && startedIso){
      var actual = new Date(startedIso);
      var diffMin = Math.round((actual - scheduled) / 60000);
      if(Math.abs(diffMin) <= 1){
        statusPill.textContent = "Tepat waktu";
        statusPill.setAttribute("data-state","ontime");
      } else if(diffMin < 0){
        statusPill.textContent = "Lebih cepat " + Math.abs(diffMin) + " menit";
        statusPill.setAttribute("data-state","ahead");
      } else {
        statusPill.textContent = "Molor " + diffMin + " menit";
        statusPill.setAttribute("data-state","behind");
      }
    } else {
      statusPill.textContent = "—";
      statusPill.removeAttribute("data-state");
    }
  }

  if(!state.actualStarts[state.activeIndex]){
    state.actualStarts[state.activeIndex] = new Date().toISOString();
    saveState();
  }

  renderSfxBar();
  renderSidebar();
  renderStage();
  tick();
  setInterval(tick, 1000);
  window.addEventListener("resize", renderSidebar);

})();
</script>

</body>
</html>
